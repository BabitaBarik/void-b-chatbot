<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="filter.css">
</head>
<body>

<!-- Carousel 1 — scrolls left -->
<div class="carousel">
    <div class="group">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
    </div>
    <div aria-hidden class="group">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
    </div>
</div>

<!-- Carousel 2 — scrolls right -->
<div class="carousel carousel--reverse">
    <div class="group group--reverse">
        <div class="card card--alt">A</div>
        <div class="card card--alt">B</div>
        <div class="card card--alt">C</div>
        <div class="card card--alt">D</div>
        <div class="card card--alt">E</div>
        <div class="card card--alt">F</div>
    </div>
    <div aria-hidden class="group group--reverse">
        <div class="card card--alt">A</div>
        <div class="card card--alt">B</div>
        <div class="card card--alt">C</div>
        <div class="card card--alt">D</div>
        <div class="card card--alt">E</div>
        <div class="card card--alt">F</div>
    </div>
</div>

</body>
</html>
